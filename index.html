<style>
/* Mesmo visual do app Habilitação Operacional: fundo verde-escuro, cartões arredondados, destaque verde, menu fixo embaixo */
:root{
  --bg:#111a16; --card:#16211c; --card-2:#1d2a24; --line:#25332c; --line-2:#33453c;
  --ink:#e7f0eb; --soft:#c8dbd0; --muted:#8ea398; --dim:#6c8177;
  --accent:#5fd99c; --accent-2:#a8f0c8; --accent-bg:#183327; --accent-line:#2e6b4e;
  --ok:#a3e07a; --ok-bg:#22331b; --warn:#e0a06b; --warn-bg:#33251d;
  --weight:#e0a06b; --fig:#e7f0eb; --fig-far:#4f6359; --tile:#1d2a24; --floor:#33453c; --mat:#183327;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 4px 6px}
.top h1{font-size:1.35rem;font-weight:600;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent-line);color:var(--accent-2);border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill svg{width:14px;height:14px}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:18px;padding:18px}
.card.accent{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-bg),var(--card) 70%)}
.card.warn{border-color:#7a4a3a;background:linear-gradient(180deg,var(--warn-bg),var(--card) 80%)}
.card h2{font-size:1.05rem;font-weight:600}
.label{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.label svg{width:16px;height:16px;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.big{font-size:2.6rem;font-weight:500;color:var(--accent);line-height:1;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:14px;min-width:0}
.stat b{display:block;font-size:1.5rem;font-weight:500;margin-top:6px;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

/* anel */
.ring{position:relative;width:190px;height:190px;margin:10px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-size:3.4rem;font-weight:400;color:var(--accent-2);line-height:1;letter-spacing:-.03em}
.ring .c span{font-size:.85rem;color:var(--soft)}
.ring circle{fill:none;stroke-width:12}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-2);margin-top:14px;padding-top:14px}
.trio div{display:flex;flex-direction:column;gap:4px}
.trio div:nth-child(2){align-items:center}
.trio div:nth-child(3){align-items:flex-end}
.trio b{font-size:1.15rem;font-weight:500}

.btn{border:1px solid var(--line-2);background:var(--card-2);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--accent);color:#0d1a13;border-color:var(--accent);width:100%;padding:14px;font-size:1rem}
.btn.ghost{background:transparent}
.btn:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.wd{border-radius:12px;padding:8px 2px;text-align:center;background:var(--card-2);border:1px solid var(--line);min-width:0}
.wd b{display:block;font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase}
.wd i{display:block;font-style:normal;font-size:.62rem;color:var(--dim);margin-top:3px;line-height:1.15;overflow-wrap:normal;word-break:keep-all;hyphens:none}
.wd.train i{color:var(--soft)}
.wd.today{border-color:var(--accent)}
.wd.ok{background:var(--ok-bg);border-color:#3d6630}
.wd.ok i{color:var(--ok)}

/* treino */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:9px 4px;text-align:center;font-weight:600;font-size:.85rem}
.chip small{display:block;font-size:.68rem;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-2)}
.ex{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:start}
.ex.done{border-color:#3d6630}
.fig{width:100%;aspect-ratio:6/5;background:var(--tile);border-radius:12px;display:block}
.exb{display:flex;flex-direction:column;gap:5px;min-width:0}
.exb h3{font-size:1rem;font-weight:600}
.exb h3 span{color:var(--accent)}
.dose{font-size:.95rem;color:var(--soft)}
.tag{align-self:flex-start;font-size:.75rem;font-weight:600;color:var(--weight);border:1px solid #7a4a3a;background:var(--warn-bg);border-radius:8px;padding:2px 8px}
.tip{font-size:.82rem;color:var(--muted)}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.set{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;font-size:.8rem;font-weight:600;color:var(--muted)}
.set.on{background:var(--ok);border-color:var(--ok);color:#13210d}
.exrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.exrow .btn{padding:6px 10px;font-size:.8rem;border-radius:10px}
.kg{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
input.num{width:60px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font-size:.9rem;font-variant-numeric:tabular-nums}
@media (max-width:400px){.ex{grid-template-columns:96px minmax(0,1fr);gap:12px}}

/* checklist */
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;background:transparent}
.box svg{width:16px;height:16px;opacity:0}
.chk.on .box{background:var(--ok);border-color:var(--ok);color:#13210d}
.chk.on .box svg{opacity:1}
.chk.on span{color:var(--muted);text-decoration:line-through}
.bar{height:6px;border-radius:9px;background:var(--card-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* evolução */
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line-2);background:var(--card-2);border-radius:10px;padding:8px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-2)}
.evo-ex{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.evo-ex:last-child{border-bottom:0}
.evo-ex .w{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.evo-ex .w label{display:flex;flex-direction:column;gap:3px;font-size:.68rem;color:var(--dim);font-weight:600}
.evo-ex .w label.cur{color:var(--accent)}
.evo-ex .w input{width:100%}
.evo-ex .w label.cur input{border-color:var(--accent-line)}
ul.list{display:flex;flex-direction:column;gap:10px;padding-left:18px;color:var(--soft)}
ul.list b{color:var(--ink)}

/* menu inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(17,26,22,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:1px solid transparent;background:transparent;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
nav.tabs svg{width:20px;height:20px}
nav.tabs button[aria-current="page"]{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent-2)}

/* cronômetro */
.timer{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:29;display:flex;justify-content:center;padding:0 16px}
.timer .in{background:var(--card-2);border:1px solid var(--accent-line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.timer b{font-size:1.7rem;font-weight:600;color:var(--accent-2);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.timer.end .in{border-color:var(--ok)}
.timer.end b{color:var(--ok)}
.timer .btn{padding:6px 10px;font-size:.8rem}
/* aviso de confirmação */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,8,.7);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .sheet{width:100%;max-width:520px;background:var(--card);border:1px solid var(--warn);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.modal h2{font-size:1.15rem;font-weight:600}
.modal ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.modal li{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.modal li b{color:var(--warn);font-weight:600;white-space:nowrap}
.modal .acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
@media (min-width:600px){.modal{align-items:center}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

    <p class="small muted" style="margin-top:10px">A semana marcada é a que aparece nos cartões do treino. Passe para a próxima a cada 7 dias.</p></div>
  ${DAYS.map((d,di)=>`<div class="card"><div class="label">Dia ${di+1} · ${d.curto}</div>
    ${d.itens.map((it,i)=>{const sk=d.id+'-'+i,c=st.cargas[sk]||{};return `<div class="evo-ex"><span class="small" style="font-weight:600">${it[1]}</span>
      <div class="w">${[1,2,3,4].map(w=>`<label class="${w===st.semana?'cur':''}">S${w}<input class="num" type="text" inputmode="decimal" placeholder="kg" value="${c[w]||''}" data-sk="${sk}" data-w="${w}"></label>`).join('')}</div></div>`;}).join('')}
  </div>`).join('')}`;
}
function bindEvolucao(){
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{st.semana=+b.dataset.w;save();render();});
  document.querySelectorAll('.evo-ex input').forEach(inp=>inp.oninput=()=>setCarga(inp.dataset.sk,+inp.dataset.w,inp.value));
}
function dicas(){
  return header('Dicas')+`
  <div class="card"><div class="label">Como executar para ganhar massa</div>
  <ul class="list" style="margin-top:12px">
    <li><b>Aquecimento:</b> 5 a 8 minutos antes de cada treino.</li>
    <li><b>Descanso:</b> 90 a 120 segundos nos exercícios pesados e 60 a 90 segundos nos isolados.</li>
    <li><b>Carga:</b> escolha um peso que torne as últimas 2 ou 3 repetições difíceis, mas sem perder a execução.</li>
    <li><b>Progressão:</b> quando completar todas as repetições com facilidade, aumente um pouco o peso.</li>
    <li><b>Alimentação:</b> consuma proteína suficiente e mantenha uma alimentação adequada ao seu objetivo.</li>
    <li><b>Recuperação:</b> respeite os dias de descanso.</li>
    <li><b>Segurança:</b> interrompa se sentir dor.</li>
  </ul></div>
  <div class="card warn"><div class="label" style="color:var(--warn)">Seus pesos</div>
    <h2 style="margin-top:8px">Halteres de 5 kg e 3 kg · caneleira de 3 kg</h2>
    <p class="small muted" style="margin:6px 0 10px">São pesos leves para pernas e glúteos. Quando um exercício ficar fácil, deixe-o mais difícil assim, uma coisa de cada vez:</p>
    <ul class="list">
      <li><b>Mais devagar:</b> desça em 3 a 4 segundos.</li>
      <li><b>Pausa:</b> pare 1 a 2 segundos na parte mais difícil.</li>
      <li><b>Mais repetições:</b> some 2 a 5 por série.</li>
      <li><b>Uma perna só:</b> elevação de quadril e stiff com uma perna de cada vez.</li>
      <li><b>Menos descanso</b> nos exercícios leves (45 a 60 segundos).</li>
    </ul></div>
  <p class="small muted" style="text-align:center;padding:8px">Seus dados ficam guardados neste aparelho.</p>`;
}
const SCREENS={painel:[painel,bindPainel],treino:[treino,bindTreino],semana:[semana,bindSemana],evolucao:[evolucao,bindEvolucao],dicas:[dicas,()=>{}]};
function render(){const [h,b]=SCREENS[st.aba]||SCREENS.painel;$('app').innerHTML=h();b();renderNav();}
function setCarga(sk,w,v){st.cargas[sk]={...(st.cargas[sk]||{}),[w]:v.trim()};save();}
function setCheck(id,v){const k=weekKey();const keep=Object.entries(st.check).filter(([kk])=>kk!==k).slice(-8);
  st.check=Object.fromEntries([...keep,[k,{...(st.check[k]||{}),[id]:v}]]);save();}

/* ---------- Cronômetro ---------- */
let tLeft=0,tInt=null;
function startTimer(s){tLeft=s;$('timer').hidden=false;$('timer').classList.remove('end');showT();clearInterval(tInt);
  tInt=setInterval(()=>{tLeft--;showT();if(tLeft<=0){clearInterval(tInt);$('timer').classList.add('end');$('tleft').textContent='Bora!';
    try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}},1000);}
function showT(){$('tleft').textContent=fmt(Math.max(0,tLeft));}
$('mno').onclick=()=>{$('modal').hidden=true;};
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').hidden=true;});
$('tplus').onclick=()=>{if(tLeft<=0)startTimer(15);else{tLeft+=15;showT();}};
$('tstop').onclick=()=>{clearInterval(tInt);$('timer').hidden=true;};

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
